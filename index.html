<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도형 넓이 최적화 시뮬레이션</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/line_polygon/assets/index-C5Zj-hYC.js"></script>
  <link rel="stylesheet" crossorigin href="/line_polygon/assets/index-CBIFOeFr.css">
</head>

<body>
    <div id="app">
        <header class="animate-in">
            <div class="logo-group">
                <h1>Area Maximizer</h1>
                <p>도형 면적 최적화 시뮬레이션</p>
            </div>
            <div class="deployment-badge">v2.1 Premium</div>
        </header>

        <main>
            <section class="canvas-container animate-in" style="animation-delay: 0.1s">
                <canvas id="simulationCanvas"></canvas>
                <div class="canvas-overlay">
                    <span class="stat-label">면적 효율성</span>
                    <span id="efficiencyValue" class="big-stat">0.0%</span>
                </div>
            </section>

            <aside class="sidebar animate-in" style="animation-delay: 0.2s">
                <div class="control-card">
                    <h2>설정</h2>

                    <div class="slider-group">
                        <div class="slider-header">
                            <span class="stat-label">변의 수 (k)</span>
                            <span id="sideCountDisplay" class="current">3</span>
                        </div>
                        <input type="range" id="sideCountSlider" min="3" max="50" value="3" step="0.01">
                    </div>

                    <div class="slider-group">
                        <div class="slider-header">
                            <span class="stat-label">둘레 길이 (L)</span>
                            <span id="perimeterDisplay" class="current">400</span>
                        </div>
                        <input type="range" id="perimeterSlider" min="200" max="800" value="400" step="1">
                    </div>
                </div>

                <div class="stats-widget">
                    <span class="label">현재 면적</span>
                    <span id="areaDisplay" class="value">0.00</span>
                </div>

                <div class="control-card description-card">
                    <p>
                        주어진 길이의 선분으로 만들 수 있는 <strong>가장 넓은 면적</strong>의 도형은 무엇일까요?
                    </p>
                    <p style="margin-top: 12px; font-size: 13px;">
                        변의 개수가 무한히 커질수록 도형은 원에 가까워지며, 면적 효율성이 100%에 도달합니다.
                    </p>
                </div>
            </aside>
        </main>

        <footer class="animate-in" style="animation-delay: 0.3s">
            <p>Designed for Excellence. &copy; 2026</p>
            <p style="margin-top: 4px;"><a href="https://heekeunlee.github.io/line_polygon/"
                    style="color: inherit; text-decoration: none;">heekeunlee.github.io/line_polygon</a></p>
        </footer>
    </div>
</body>

</html>
